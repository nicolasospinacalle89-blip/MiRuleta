<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta de Reflexión</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --corazon: #c0392b; --poder: #922b21; --deseo: #e74c3c; --bg-color: #1a1a1a; }
        body { margin: 0; background-color: var(--bg-color); color: #f1f2f6; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .roulette-wrapper { position: relative; width: 350px; height: 350px; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; border: 6px solid #2c3e50; background: conic-gradient(var(--corazon) 0deg 120deg, var(--poder) 120deg 240deg, var(--deseo) 240deg 360deg); transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
        .label { position: absolute; width: 50%; height: 30px; top: 50%; left: 50%; transform-origin: left center; display: flex; align-items: center; color: white; font-family: 'Archivo Black', sans-serif; padding-left: 35px; pointer-events: none; }
        .label.corazon { transform: rotate(60deg); } .label.poder { transform: rotate(180deg); } .label.deseo { transform: rotate(300deg); }
        .btn-spin { margin-top: 50px; padding: 15px 50px; font-size: 1.5rem; font-family: 'Archivo Black', sans-serif; background-color: #b33939; color: white; border-radius: 30px; cursor: pointer; border: none; }
        .result-container { margin-top: 30px; width: 80%; max-width: 500px; background: rgba(30, 30, 30, 0.8); padding: 25px; border-radius: 20px; text-align: center; display: none; }
    </style>
</head>
<body>

    <div class="roulette-wrapper">
        <div class="wheel" id="wheel">
            <div class="label corazon">CORAZÓN</div>
            <div class="label poder">PODER</div>
            <div class="label deseo">DESEO</div>
        </div>
    </div>

    <button class="btn-spin" id="spin-btn">Tirar Ruleta</button>

    <div class="result-container" id="result-container">
        <h2 id="result-category"></h2>
        <p id="result-question"></p>
    </div>

    <script>
        // AQUÍ ESTÁN TODAS TUS PREGUNTAS
        const banco = {
            corazon: [
                "¿Envías fotos íntimas a tu pareja sin esperar nada a cambio?",
                "¿Te gusta que tu pareja te muestre como símbolo de orgullo porque eres atractiv@?",
                "¿Aceptas que tu pareja quiera cambiar la forma en que te vistes?",
                "¿Te gusta que tu novio o pareja decida qué plan harán sin darte oportunidad de decidir?",
                "¿Tienes sexo con tu pareja aun cuando no quieres?",
                "¿Te arreglas más cuando vas a salir con alguien que te gusta?",
                "¿Aceptas que crean que cualquier gesto amable tuyo es una invitación a algo más?",
                "¿Te gusta que alguien piense que por verte desnud@ puede opinar sobre tu cuerpo?",
                "¿Aceptas que alguien intente llevar una conversación cotidiana al terreno sexual?",
                "¿Alguna vez has sentido que tienes que justificar un “no” más de lo necesario?",
                "¿Te has adaptado físicamente para encajar en un lugar, aunque eso no seas tú?",
                "¿Intentas “caer bien” para que te respeten?",
                "¿Aceptarías salir con un extranjero si te promete regalos caros o una mejor vida?",
                "¿Has sentido que en ciertos lugares de la ciudad tu cuerpo llama más la atención?",
                "¿Te sentirías halagad@ si alguien te dice que eres “lo mejor de Medellín” por tu apariencia?",
                "¿Te emociona más que te escriba alguien de otro país?",
                "¿Aceptarías seguir hablando con un extranjero aunque no te guste tanto?",
                "¿Te sentirías especial si alguien te dice que contigo quiere vivir “la verdadera experiencia Medellín”?"
            ],
            poder: [
                "¿Siempre que alguien te toca o te saluda con contacto te pide autorización?",
                "¿Trabajas más de 10 horas sin parar para ir al baño, comer o tomar agua?",
                "¿Haces funciones en tu trabajo que nadie te enseñó y que te cuestan mucho?",
                "¿Recibes dinero o regalos de alguien a quien le gustas solo por tu apariencia?",
                "¿Aceptas que alguien te vea como un fetiche?",
                "¿Te incomoda que alguien crea que tu forma de vestir le da permiso para imaginar cosas contigo?",
                "¿Has aceptado un trato injusto por necesidad económica, emocional o social?",
                "¿Alguna vez tu apariencia te abrió una puerta, pero también te puso una condición?",
                "¿Has aprovechado tu imagen en un trabajo para ganar más reconocimiento?",
                "¿Has sentido que alguien tiene derecho sobre tu tiempo o tu cuerpo porque te dio algo?",
                "¿Aceptarías que tu pareja te diga cómo trabajar y además se quede con un porcentaje?",
                "¿Aceptas que alguien que te conoció una sola vez, ya pueda hablarte con confianza o morbo?",
                "¿Aceptarías que un extranjero te invite a un hotel de lujo aunque no te guste tanto?",
                "¿Aceptarías un celular, dinero o un viaje a cambio de pasar la noche con alguien?",
                "¿Has sentido que algunos hombres extranjeros creen que por estar en esta ciudad pueden pedir más de tu cuerpo?",
                "¿Aceptarías acompañar a un extranjero toda una noche aunque no tengas ganas?",
                "¿Has pensado que salir con alguien de afuera puede ser una oportunidad para conseguir algo?",
                "¿Te emociona que alguien te vea como un lujo que puede pagar?"
            ],
            deseo: [
                "¿Te gusta que las personas te miren porque eres atractiv@? ¿Disfrutas eso?",
                "¿Le pides a tu pareja que use palabras soeces contigo durante el sexo?",
                "¿Pides prácticas sexuales intensas porque te producen placer?",
                "¿El acoso callejero te hace sentir atractiva o admirada?",
                "¿Te gusta que personas de distintos espacios te deseen y te lo hagan notar?",
                "¿Podrías recordar cuándo fue la primera vez que sentiste deseo sexual?",
                "¿Te agrada recibir mensajes por la noche de personas que expresan sentir calentura?",
                "¿Te gusta que alguien te hable bonito, pero solo quiere saber si estás “disponible”?",
                "¿Te gusta que te lean desde el deseo incluso cuando solo estás caminando?",
                "¿Te gusta que alguien imagine cosas contigo aunque no te conozca?",
                "¿Te sientes halagad@ cuando alguien te escribe solo para decirte que te imaginó?",
                "¿Te agrada que te busquen más por calentura que por cariño?",
                "¿Te sentirías más atractiva si un turista se fija en ti?",
                "¿Te arreglas más cuando vas para un parche donde sabes que hay turistas?",
                "¿Te incomoda cuando alguien te “desnuda con la mirada”?",
                "¿Te incomoda cuando alguien ya se imaginó cosas contigo sin conocerte?",
                "¿Te incomoda cuando alguien se siente con derecho a desearte de forma evidente?",
                "¿Aceptas que alguien actúe contigo como si hubiera tensión sexual, aunque no la haya?"
            ]
        };

        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spin-btn');
        const resultContainer = document.getElementById('result-container');
        const resultCategory = document.getElementById('result-category');
        const resultQuestion = document.getElementById('result-question');
        let currentRotation = 0;

        spinBtn.addEventListener('click', () => {
            spinBtn.disabled = true;
            const randomDegree = Math.floor(Math.random() * 360) + 1440;
            currentRotation += randomDegree;
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                const angle = currentRotation % 360;
                let cat = (angle >= 0 && angle < 120) ? "corazon" : (angle >= 120 && angle < 240) ? "poder" : "deseo";
                
                resultContainer.style.display = 'block';
                resultCategory.textContent = cat.toUpperCase();
                resultQuestion.textContent = banco[cat][Math.floor(Math.random() * banco[cat].length)];
                spinBtn.disabled = false;
            }, 4000);
        });
    </script>
</body>
</html>
